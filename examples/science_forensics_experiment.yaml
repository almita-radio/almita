null_hypotheses:
  H0_time:
    statement: the candidate does not drift with time beyond the stationary-sky prediction
    rejected_when: '|excess drift|/SE >= 5 and total excess >= 2 channels over the span, OR stationary chi2/dof >= 4 with range >= 2 channels'
    effect_size: excess drift (Hz/h) and total channels over the span, with SE
  H0_sky:
    statement: position offsets equal the parameter-free stationary-sky prediction (f0/c) x d(LSRK shift)
    consistent_when: chi2/dof < 4 over the bracketed B/C offsets
    effect_size: measured minus predicted offset (Hz) with SE
  H0_frequency:
    statement: position offsets are zero (receiver / topocentric-frequency fixed)
    consistent_when: chi2/dof < 4 against zero
    effect_size: offset (Hz) with SE
  global_shift: 'whole-spectrum cross-correlation shift (candidate and known spurs excluded) vs candidate motion: slope ~1 with R2>=0.8 -> the
    candidate moves with everything (TIME_GLOBAL); flat global with moving candidate -> TIME_CANDIDATE_ONLY'
