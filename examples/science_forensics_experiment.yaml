negative_background_followup:
  why: integrated SCIENCE maps are strongly negative (REDUCE baseline offset); the fixed-position series doubles as the test
  checks:
  - per-capture median level of the calibrated spectrum vs time (Experiment A, fixed sky)
  - per-capture median level vs position (Experiment B)
  - baseline_fit_quality_rms_fraction (Level 1 quality.metrics) vs the negative offset per capture
  - the same control windows as the negative-map audit, before and after the candidate window
  interpretation: level stationary at a position and equal across positions -> negativity is a fixed REDUCE baseline offset; level drifting with
    time -> instrument gain/temperature; level tied to position -> sky/ground pickup
readiness:
  verdict: READY FOR LIVE PREFLIGHT (plan and analysis); execution is a manual field action
  software:
  - plan, CSVs and analysis validated on synthetic and replayed real data
  - capture.py --csv accepts explicit ordered lists with repeated coordinates (code audit; CSV validated against its own preflight rules)
  - REDUCE/SCIENCE identity (point_number/data_filename, capture sha256) keeps repeated coordinates distinct - verified by test
  operator_prerequisites:
  - 'mount/antenna deployed outdoors (indoors: no real GOTO); no software authorization changes that'
  - manual `capture.py --csv ...` (OBSERVE spec/orchestrator cannot express an explicit sequence)
  - start inside a `windows` result so that A, B and C stay on one hour-angle side above min altitude for the whole run
  - run capture.py --preflight-only on the emitted CSV before the first real run
  known_limits:
  - 'the feature may be absent on the new day: that is a result, not a failure (runbook section 9)'
  - bracket interpolation is exact for linear drift; curvature over a 65 s bracket adds error (quantified in the power test)
  - 'OBSERVE orchestrator not modified (minimal future change: accept an explicit `sequence:` list in the spec)'
